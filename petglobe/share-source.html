// ---------- a clock and a dice the test drives, so every run draws exactly the same pictures
let T = 0, seed = 20261112;
function rnd() { seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }

// ---------- the night sky behind everything, with slow snow, and the shadow the globe stands on
const bg = document.getElementById('bg'), b = bg.getContext('2d'); b.setTransform(2, 0, 0, 2, 0, 0);
const dots = []; for (let i = 0; i < 110; i++) dots.push({ x: rnd() * 1200, y: rnd() * 630, r: 0.9 + rnd() * rnd() * 3.6, a: 0.35 + rnd() * 0.6, vy: 7 + rnd() * 15, ph: rnd() * 6.28 });
function drawBack() {
  const gr = b.createRadialGradient(700, 250, 40, 700, 250, 900);
  gr.addColorStop(0, '#22356b'); gr.addColorStop(0.42, '#182851'); gr.addColorStop(1, '#0a1330');
  b.fillStyle = gr; b.fillRect(0, 0, 1200, 630);
  b.fillStyle = '#fff';
  for (const d of dots) { b.globalAlpha = d.a; b.beginPath(); b.arc(d.x + Math.sin(T * 0.7 + d.ph) * 3, d.y, d.r, 0, 7); b.fill(); }
  b.globalAlpha = 1;
  b.save(); b.filter = 'blur(7px)'; b.fillStyle = 'rgba(3,6,20,.72)'; b.beginPath(); b.ellipse(298, 586, 262, 15, 0, 0, 7); b.fill(); b.restore();
}

const globeEl = document.getElementById('globe'), cv = document.getElementById('c'), g = cv.getContext('2d');
const W = 489, H = 577, PAD = 55.5, dpr = 2, R = W * 0.46, cx = W / 2, cy = R + W * 0.03;   // (W and H: the size of the original page's globe; PAD: extra room each side)

// ---- where Little Guy stands, in globe units (-1..1 across the sphere; y grows downward)
const groundAt = x => 0.62 - 0.08 * Math.cos(x * 1.6);
const CAT_H = 1.45;                                 // his height, in globe radii
const CAT_FOOT = groundAt(0) + 0.125;          // sunk a little into the snow
const S = CAT_H / M.H;                              // globe units per photo pixel
const catLeft = -(M.W * S) / 2, catTop = CAT_FOOT - CAT_H;

// landmarks in the photo (pixels)
const PIVOT = [162, 305], NOSE = [165, 266];
const EYES = [{ x: 105, y: 187, rx: 25, ry: 14, lid: M.lidL }, { x: 226, y: 190, rx: 27, ry: 14, lid: M.lidR }];
const EARS = { earL: { p: [58, 100], out: -1 }, earR: { p: [262, 104], out: 1 } };

// ---- snow
const FLAKES = 300, flakes = [];
function flake(settled) {
  const x = rnd() * 1.8 - 0.9;
  return { x, y: settled ? groundAt(x) - rnd() * 0.02 : rnd() * 1.6 - 0.9, vx: 0, vy: 0,
    r: 0.006 + rnd() * 0.012, front: rnd() < 0.55, rest: settled, tw: rnd() * 6.28 };
}
for (let i = 0; i < FLAKES; i++) flakes.push(flake(true));
function stir(power, dirX = 0) {
  for (const f of flakes) {
    f.rest = false;
    f.vx += (rnd() - 0.5) * power + dirX * (0.5 + rnd() * 0.6);
    f.vy -= rnd() * power * 1.25;
  }
}

// ---- Little Guy's state
const cat = {
  rot: 0, dx: 0, dy: 0,             // head turn (rad) and shift (photo px)
  lookRot: 0, lookDy: 0,            // where he wants to look
  ears: { earL: 0, earR: 0 }, earV: { earL: 0, earR: 0 },
  blink: 0, blinkT: 2.5,            // idle blinking
  squeeze: 0,                       // eyes shut tight (sneeze)
  sleep: 0, settled: 0, glow: 0, msg: 0,
  watch: null, watchT: 0,
  sneeze: 0, noseFlake: null, noseAt: 0, puffs: [], zzz: [], zT: 0,
};

let sway = 0, swayV = 0;
function shake(dir = (rnd() < 0.5 ? -1 : 1)) {
  stir(1.6, dir * 0.4);
  if (!reduce) swayV += dir * 0.09;
  wake();
}
function wake() {
  // a little startled: ears flick out, a quick blink, and a snowflake is on its way to his nose
  cat.earV.earL -= 7; cat.earV.earR += 7;
  cat.blink = Math.max(cat.blink, 0.01); cat.blinkT = 0;
  cat.sleep = Math.min(cat.sleep, 0.2); cat.settled = 0;
  if (!cat.noseFlake && !cat.noseAt) cat.noseAt = T + NOSE_DELAY;
}

// ---- drawing
const P = (x, y) => [cx + x * R, cy + y * R];
function scene() {
  const sky = g.createLinearGradient(0, cy - R, 0, cy + R);
  sky.addColorStop(0, '#1d2752'); sky.addColorStop(0.55, '#4a4f86'); sky.addColorStop(1, '#8c8fc2');
  g.fillStyle = sky; g.fillRect(cx - R, cy - R, R * 2, R * 2);
  const [mx, my] = P(0.52, -0.5);
  const moon = g.createRadialGradient(mx, my, 0, mx, my, R * 0.32);
  moon.addColorStop(0, 'rgba(255,248,226,.95)'); moon.addColorStop(0.18, 'rgba(255,244,214,.85)'); moon.addColorStop(0.2, 'rgba(255,240,210,.25)'); moon.addColorStop(1, 'rgba(255,240,210,0)');
  g.fillStyle = moon; g.beginPath(); g.arc(mx, my, R * 0.32, 0, 7); g.fill();
  g.fillStyle = '#5d6299';
  g.beginPath(); g.moveTo(cx - R, cy + R * 0.42);
  for (let x = -1; x <= 1.001; x += 0.05) { const [px, py] = P(x, 0.36 - 0.07 * Math.sin(x * 3.1 + 1)); g.lineTo(px, py); }
  g.lineTo(cx + R, cy + R); g.lineTo(cx - R, cy + R); g.fill();
  g.fillStyle = '#3c4378';
  for (const [x, s] of [[-0.78, 0.17], [-0.62, 0.22], [-0.47, 0.15], [0.55, 0.2], [0.7, 0.16], [0.82, 0.21]]) {
    const [px, py] = P(x, 0.4 - s * 0.2);
    g.beginPath(); g.moveTo(px, py - s * R); g.lineTo(px + s * R * 0.32, py + s * R * 0.15); g.lineTo(px - s * R * 0.32, py + s * R * 0.15); g.fill();
  }
}
function ground() {
  const grd = g.createLinearGradient(0, cy + R * 0.5, 0, cy + R);
  grd.addColorStop(0, '#f4f6ff'); grd.addColorStop(1, '#c7cbe8');
  g.fillStyle = grd; g.beginPath(); g.moveTo(cx - R, cy + R);
  for (let x = -1; x <= 1.001; x += 0.04) { const [px, py] = P(x, groundAt(x)); g.lineTo(px, py); }
  g.lineTo(cx + R, cy + R); g.fill();
}
function glowBehind() {
  if (cat.glow < 0.01) return;
  const [gx, gy] = P(0, catTop + CAT_H * 0.45);
  const rg = g.createRadialGradient(gx, gy, R * 0.05, gx, gy, R * 0.85);
  rg.addColorStop(0, `rgba(255,214,140,${0.55 * cat.glow})`); rg.addColorStop(0.5, `rgba(255,190,120,${0.22 * cat.glow})`); rg.addColorStop(1, 'rgba(255,180,110,0)');
  g.fillStyle = rg; g.beginPath(); g.arc(gx, gy, R * 0.85, 0, 7); g.fill();
}
const layer = (k) => { const b = M[k]; g.drawImage(img[k], b[0], b[1], b[2] - b[0], b[3] - b[1]); };
function drawCat(t) {
  if (!img.body.complete || !img.head.complete) return;
  const [ox, oy] = P(catLeft, catTop), s = S * R;          // screen px per photo px
  const [fx, fy] = P(0, CAT_FOOT);
  // shadow on the snow, warmer while he glows
  g.fillStyle = 'rgba(70,72,120,.28)'; g.beginPath(); g.ellipse(fx + R * 0.04, fy - R * 0.03, R * 0.42, R * 0.05, 0, 0, 7); g.fill();
  const breath = Math.sin(t * (cat.sleep > 0.5 ? 1.6 : 2.4)) * (0.008 + 0.01 * cat.sleep);
  g.save(); g.translate(ox, oy); g.scale(s, s);
  // body breathes (stretching up from the paws)
  g.save(); g.translate(0, M.H); g.scale(1 + breath * 0.3, 1 + breath); g.translate(0, -M.H); layer('body'); g.restore();
  // head: turns around the neck, rides the breath
  g.translate(PIVOT[0], PIVOT[1]); g.rotate(cat.rot); g.translate(cat.dx, cat.dy - breath * (M.H - PIVOT[1])); g.translate(-PIVOT[0], -PIVOT[1]);
  for (const k of ['earL', 'earR']) {
    const e = EARS[k]; g.save(); g.translate(e.p[0], e.p[1]); g.rotate(cat.ears[k]); g.translate(-e.p[0], -e.p[1]); layer(k); g.restore();
  }
  layer('head');
  // eyelids
  const shut = Math.min(1, Math.max(cat.blink > 0 ? Math.sin(Math.min(1, cat.blink) * Math.PI) : 0, cat.squeeze, cat.sleep * 0.95));
  if (shut > 0.02) for (const e of EYES) {

    const drop = e.ry * 2.2 * shut, edge = e.y - e.ry + drop;
    g.save(); g.beginPath(); g.ellipse(e.x, e.y, e.rx + 1, e.ry + 1, 0, 0, 7); g.clip();
    g.beginPath(); g.moveTo(e.x - e.rx - 3, e.y - e.ry - 3); g.lineTo(e.x + e.rx + 3, e.y - e.ry - 3);
    g.lineTo(e.x + e.rx + 3, edge); g.quadraticCurveTo(e.x, edge + e.ry * 0.6 * shut, e.x - e.rx - 3, edge); g.closePath(); g.clip();

const DRIFT = [[-20, 852], [40, 846], [150, 840], [265, 846], [330, 812], [385, 772], [440, 758], [490, 768], [530, 800]];
function drift() {

  g.lineTo(all[0][0], all[0][1]);

function snow(front, t) {

function message() {

  g.strokeStyle = 'rgba(255,255,255,.22)'; g.lineWidth = R * 0.018;

  wood.addColorStop(0, '#3e2614'); wood.addColorStop(0.3, '#7a5130'); wood.addColorStop(0.55, '#6b4527'); wood.addColorStop(1, '#2f1d0f');

  for (let i = 0; i < 9; i++) { const y = top + bh * (0.1 + i * 0.1); g.beginPath(); g.moveTo(cx - bw, y); g.bezierCurveTo(cx - bw * 0.3, y + 4 * Math.sin(i), cx + bw * 0.2, y - 5 * Math.cos(i), cx + bw, y + 2); g.stroke(); }
  g.restore();
  g.fillStyle = '#2a1a0c'; g.beginPath(); g.ellipse(cx, top, bw * 0.62, R * 0.07, 0, 0, 7); g.fill();

  g.fillStyle = 'rgba(255,240,200,.5)'; g.fillText('LITTLE GUY', cx, py + ph / 2 + 1.5);

// ---- behaviour
const approach = (v, to, rate, dt) => v + (to - v) * Math.min(1, rate * dt);
function behave(dt, t) {
  const airborne = flakes.reduce((n, f) => n + (f.rest ? 0 : 1), 0) / FLAKES;
  const snowing = airborne > 0.06;
  cat.settled = snowing ? 0 : cat.settled + dt;

  // glow while it snows, fading as it settles
  cat.glow = approach(cat.glow, snowing ? 1 : 0, snowing ? 2 : GLOW_FADE, dt);

  // watch the snow: pick a falling flake in front and follow it with his head
  cat.watchT -= dt;

    const near = flakes.filter(f => !f.rest && f.front && Math.abs(f.x) < 0.8 && f.y < 0.2);
    cat.watch = near.length ? near[(rnd() * near.length) | 0] : null; cat.watchT = 1 + rnd() * 1.2;
  }
  if (cat.watch && snowing && cat.sleep < 0.3) {
    const [hx, hy] = toGlobe(PIVOT[0], 190);
    cat.lookRot = Math.max(-0.09, Math.min(0.09, (cat.watch.x - hx) * 0.16));
    cat.lookDy = Math.max(-6, Math.min(5, (cat.watch.y - hy) * 14));
  } else { cat.lookRot = 0; cat.lookDy = 0; }

  // the snowflake for his nose: drifts down onto it, then a sneeze
  const [nx, ny] = toGlobe(NOSE[0], NOSE[1] - 4);
  if (cat.noseAt && t >= cat.noseAt && !cat.noseFlake) { cat.noseFlake = { x: nx + 0.12, y: ny - 0.45, landed: false }; cat.noseAt = 0; }
  const nf = cat.noseFlake;
  if (nf && !nf.landed) {
    nf.x = approach(nf.x, nx + Math.sin(t * 3) * 0.01, 0.9, dt); nf.y += NOSE_FALL * dt;
    cat.lookRot = approach(cat.lookRot, 0, 3, dt); cat.lookDy = -3;     // he watches it come down
    if (nf.y >= ny) { nf.landed = true; nf.t = 0; }
  } else if (nf && nf.landed) {
    nf.t += dt;
    cat.squeeze = nf.t < 0.55 ? Math.min(1, nf.t * 4) : 0;              // eyes scrunch...
    if (nf.t > 0.55 && !nf.sneezed) {                                   // ...achoo!
      nf.sneezed = true; cat.sneeze = 1;
      for (let i = 0; i < 9; i++) cat.puffs.push({ x: nx, y: ny, vx: (rnd() - 0.5) * 0.5, vy: -0.05 - rnd() * 0.25, r: 0.008 + rnd() * 0.01, life: 1 });
      cat.blink = 0.01;
    }
    if (nf.t > 0.6) cat.noseFlake = null;

  let sneezeRot = 0, sneezeDy = 0;

  for (const p of cat.puffs) { p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= Math.pow(0.2, dt); p.life -= dt * 1.2; }

  // once it settles: the words appear, then he dozes off
  cat.msg = approach(cat.msg, cat.settled > 1.5 ? 1 : 0, cat.settled > 1.5 ? 0.8 : 4, dt);
  cat.sleep = approach(cat.sleep, cat.settled > 7 ? 1 : 0, cat.settled > 7 ? 0.35 : 3, dt);
  if (cat.sleep > 0.8) {
    cat.zT -= dt;
    if (cat.zT <= 0) { const [zx, zy] = toGlobe(320, 150); cat.zzz.push({ x: zx, y: zy, life: 0, size: 0.07 + rnd() * 0.04 }); cat.zT = 1.6; }
  }
  for (const z of cat.zzz) { z.life += dt; z.y -= 0.05 * dt; z.x += 0.06 * dt + Math.sin(z.life * 3) * 0.002; }
  cat.zzz = cat.zzz.filter(z => z.life < 1.6);

  // ears spring back after a twitch (and twitch on their own now and then)
  for (const k of ['earL', 'earR']) {
    cat.earV[k] += -cat.ears[k] * 160 * dt; cat.earV[k] *= Math.pow(0.02, dt); cat.ears[k] += cat.earV[k] * dt;
    cat.ears[k] = Math.max(-0.35, Math.min(0.35, cat.ears[k]));

  // put the head where it should be: looking, sneezing, or drooping asleep
  const droop = cat.sleep;

  cat.dy = approach(cat.dy, cat.lookDy * (1 - droop) + 9 * droop, 4, dt);

// ---------- one step of time, and one picture
function step(dt) {
  T += dt; const t = T, real = dt; dt = real * FLAKE_SPEED;
  for (const f of flakes) {
    if (f.rest) continue;
    f.vy += 0.18 * dt; f.vx *= Math.pow(0.35, dt); f.vy *= Math.pow(0.45, dt);
    f.vx += Math.sin(t * 0.9 + f.tw) * 0.02 * dt;

  const t = T;

window.__card = {
  ready: Promise.all([document.fonts.load('900 101px Archivo'), document.fonts.load('700 19px Archivo'), document.fonts.load('20px Marcellus'), document.fonts.load('19px Atkinson'),
    ...Object.values(img).map(i => i.decode()), document.querySelector('.site img').decode()]).then(() => document.fonts.ready).then(() => { render(); return true; }),
  step(dt, n = 1) { for (let i = 0; i < n; i++) step(dt); render(); },
  shake(dir) { shake(dir); },
  get air() { return flakes.reduce((n, f) => n + (f.rest ? 0 : 1), 0) / FLAKES; },

};

<script type="text/plain" id="how-to-make-the-picture-and-the-film">
HOW share.jpg AND share.mp4 ARE MADE FROM THIS PAGE (needs Node with Playwright, and ffmpeg)

1. Serve this folder, for example:   python3 -m http.server 8792
2. Save the script below as shoot.js and run:   node shoot.js http://127.0.0.1:8792/share-source.html out
3. The picture: shrink out/still@2x.png to 1200 x 630 and save it as share.jpg (JPEG, quality 88).
4. The film:   ffmpeg -framerate 30 -i out/frames/f-%03d.jpg -vf "scale=1200:630:flags=lanczos,format=yuv420p" -c:v libx264 -profile:v high -level 3.1 -preset veryslow -crf 21 -movflags +faststart -an share.mp4
5. In petglobe/index.html, raise ?v=1 to ?v=2 on share.jpg and share.mp4, so apps fetch the new ones.

shoot.js:

// Films the card: 240 pictures (8 seconds at 30 a second). Calm, then three shakes at 0.9 s, snow, a sneeze, calm again.
// It also keeps the still picture: the first moment after the sneeze when his face is clear, his eyes are open,
// the globe is steady and snow is still falling.
//   node shoot.js <address of this page> <folder for the results>
const { chromium } = require('playwright'); const fs = require('fs');
(async () => {
  const [url, out] = process.argv.slice(2); fs.rmSync(out + '/frames', { recursive: true, force: true }); fs.mkdirSync(out + '/frames', { recursive: true });
  const browser = await chromium.launch(), page = await (await browser.newContext({ viewport: { width: 1200, height: 630 }, deviceScaleFactor: 2 })).newPage(); const errs = [];
  page.on('pageerror', e => errs.push(String(e && e.stack || e).slice(0, 400))); page.on('console', m => { if (m.type() === 'error') errs.push(m.text().slice(0, 300)); });
  await page.goto(url); await page.evaluate(() => window.__card.ready);
  const card = page.locator('#card'), dt = 1 / 30, shakes = [0.9, 1.08, 1.26], only = process.env.STILL_ONLY; let k = 0, still = null;
  for (let i = 0; i < 240; i++) {
    const T = i * dt;
    if (i) await page.evaluate(d => window.__card.step(d), dt);
    let shook = false; while (k < shakes.length && T >= shakes[k] - 1e-6) { await page.evaluate(d => window.__card.shake(d), k % 2 ? -1 : 1); k++; shook = true; }
    if (shook || !i) await page.evaluate(() => window.__card.step(0));
    const s = await page.evaluate(() => { const c = window.__card, a = c.cat; return { air: c.air, face: c.onFace, shut: a.blink > 0 || a.squeeze > 0, sneeze: a.sneeze > 0, nose: !!a.noseFlake, sway: c.sway, rot: a._rot ?? a.rot, glow: a.glow, ears: Math.max(Math.abs(a.ears.earL), Math.abs(a.ears.earR)), puffs: a.puffs.length }; });
    if (!only) await card.screenshot({ path: `${out}/frames/f-${String(i).padStart(3, '0')}.jpg`, type: 'jpeg', quality: 95 });
    if (!still && T >= 4.9 && s.face === 0 && !s.shut && !s.sneeze && !s.nose && !s.puffs && Math.abs(s.sway) < 0.0015 && Math.abs(s.rot) < 0.03 && s.ears < 0.03 && s.air > 0.12) { still = { i, T, ...s }; await card.screenshot({ path: out + '/still@2x.png' }); if (only) break; }
  }
  console.log('still picture:', still ? `frame ${still.i} at ${still.T.toFixed(2)} s, snow in the air ${(still.air * 100).toFixed(0)}%` : 'NONE FOUND');
  console.log(errs.length ? 'ERRORS:\n  ' + errs.join('\n  ') : 'no errors'); await browser.close();
})().catch(e => { console.error('FAILED', e); process.exit(1); });
</script>
