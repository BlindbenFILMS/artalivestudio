<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>A Magic Postcard · Art Alive</title>
<meta name="description" content="Point your phone at the postcard and watch it come alive.">
<meta name="theme-color" content="#1f3352">
<link rel="icon" type="image/png" href="../favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@112..125,600..900&family=Atkinson+Hyperlegible:wght@400;700&family=Yellowtail&family=Caveat:wght@500;600;700&display=swap">
<style>
[hidden]{display:none!important}
html,body{margin:0;background:#1f3352;color:#f6f1e8;font:18px/1.5 'Atkinson Hyperlegible',Verdana,Arial,sans-serif;touch-action:manipulation}
main{max-width:760px;margin:0 auto;padding:18px 16px 40px;display:flex;flex-direction:column;gap:16px}
.top{display:flex;align-items:center;gap:12px;text-decoration:none;color:inherit}.top img{height:40px;width:auto}
.k{margin:0;font:800 13px/1 Archivo,Arial,sans-serif;letter-spacing:.2em;text-transform:uppercase;color:#ec9a72}
h1{margin:0;font:900 clamp(28px,7vw,50px)/1 Archivo,'Arial Black',Arial,sans-serif;font-stretch:118%;text-transform:uppercase;overflow-wrap:anywhere}
.card{position:relative;width:100%;aspect-ratio:3/2;border-radius:6px;overflow:hidden;box-shadow:0 30px 60px -25px rgba(0,0,0,.9)}
.card canvas{position:absolute;inset:0;width:100%;height:100%}
.card video{position:absolute;left:0;top:0;width:66.6667%;height:100%;object-fit:cover;opacity:0;transition:opacity .6s}
.card canvas.anim{left:0;top:0;width:66.6667%;height:100%;opacity:0;transition:opacity .6s}.card.on canvas.anim{opacity:1}
.card .top{position:absolute;left:0;top:0;width:66.6667%;height:100%;opacity:0;transition:opacity .6s;pointer-events:none}
.card.on video,.card.on .top{opacity:1}
.cam .live canvas{position:absolute;inset:0;width:100%;height:100%}
/* the video message under the card, like the artist's clip under a Blind Canvas painting: a black strip with FROM and their name, then the video */
.from{margin-top:14px;display:flex;flex-direction:column;gap:8px}
.strip{background:#000;color:#fff;border-radius:3px;padding:16px 12px;text-align:center;font:900 clamp(22px,5.4vw,38px)/1 Archivo,'Arial Black',Arial,sans-serif;font-stretch:118%;letter-spacing:.06em;text-transform:uppercase;overflow-wrap:anywhere}
.fvid{position:relative;width:100%;aspect-ratio:16/9;background:#000;border-radius:3px;overflow:hidden}
.fvid video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;display:block;cursor:pointer}
.fvid .pp{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:72px;height:72px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;font:900 24px/1 Archivo,Arial,sans-serif;cursor:pointer}
.fvid.on .pp{opacity:0}.fvid.on .pp:focus-visible{opacity:1}
.cam .under{position:absolute;left:0;top:0;width:576px;transform-origin:0 0;opacity:0;transition:opacity .35s;display:flex;flex-direction:column;gap:8px}
.cam .under .strip{padding:0;height:64px;display:flex;align-items:center;justify-content:center;font-size:34px;border-radius:2px}
.cam .under .uv{position:relative;width:576px;background:#000;border-radius:2px;overflow:hidden}
.cam .under video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;display:block}
.bar{display:flex;flex-wrap:wrap;gap:10px}
.bar button{flex:1 1 200px;min-height:56px;padding:0 18px;border-radius:999px;border:2px solid rgba(185,207,230,.35);background:transparent;color:#f6f1e8;font:800 15px/1 Archivo,Arial,sans-serif;letter-spacing:.06em;text-transform:uppercase;cursor:pointer}
.bar .pri{background:#ec9a72;border-color:#ec9a72;color:#14100c}
button:focus-visible{outline:3px solid #f2c14e;outline-offset:3px}
.msg{background:#fbf8f2;color:#1b1f26;border-radius:6px;padding:20px 22px;font:500 26px/1.35 Caveat,'Segoe Print',cursive;white-space:pre-line}
.msg small{display:block;margin-bottom:6px;font:800 12px/1 Archivo,Arial,sans-serif;letter-spacing:.2em;text-transform:uppercase;color:#b4531a}
.made{text-align:center;color:#b9cfe6;font-size:15px}.made a{color:#f6f1e8}
.wait{display:flex;align-items:center;gap:12px;color:#b9cfe6}.spin{width:30px;height:30px;border-radius:50%;border:4px solid rgba(185,207,230,.25);border-top-color:#ec9a72;animation:s 1s linear infinite}@keyframes s{to{transform:rotate(1turn)}}
/* the camera */
.cam{position:fixed;inset:0;z-index:50;background:#000;display:flex;align-items:center;justify-content:center;overflow:hidden}
.cam .box{position:relative}.cam .box>video{position:absolute;inset:0;width:100%;height:100%;object-fit:fill}
.cam .live{position:absolute;left:0;top:0;transform-origin:0 0;opacity:0;transition:opacity .35s;pointer-events:none;overflow:hidden;background:#000}
.cam .live video{width:100%;height:100%;object-fit:cover;display:block}
.cam .tip{position:fixed;left:50%;top:max(16px,env(safe-area-inset-top));transform:translateX(-50%);margin:0;padding:10px 16px;border-radius:999px;background:rgba(0,0,0,.75);color:#fff;font-weight:700;max-width:calc(100% - 32px);text-align:center}
.cam .tip.hide{display:none}
.cam .cbar{position:fixed;left:16px;right:16px;bottom:max(16px,env(safe-area-inset-bottom));display:flex;gap:10px;justify-content:center}
.cam .cbar button{flex:0 1 200px;min-height:54px;border-radius:999px;border:0;background:rgba(0,0,0,.75);color:#fff;font:800 15px/1 Archivo,Arial,sans-serif;letter-spacing:.06em;text-transform:uppercase;cursor:pointer}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}
/* send a video reply */
.reply{margin-top:22px;background:#26406a;border-radius:10px;padding:20px 18px;display:flex;flex-direction:column;gap:12px}
.reply h2{margin:0;font:900 22px/1.15 Archivo,'Arial Black',Arial,sans-serif;font-stretch:112%;text-transform:uppercase}
.reply p{margin:0;color:#d5e3f2;font-size:16px}
.reply .pick{display:flex;flex-wrap:wrap;gap:10px}
.reply input[type=file]{position:absolute;width:1px;height:1px;opacity:0}
.reply label.b,.reply button{flex:1 1 160px;min-height:52px;padding:0 16px;border-radius:999px;border:2px solid rgba(185,207,230,.4);background:transparent;color:#f6f1e8;font:800 14px/1 Archivo,Arial,sans-serif;letter-spacing:.06em;text-transform:uppercase;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;text-align:center}
.reply .b.pri,.reply button.pri{background:#ec9a72;border-color:#ec9a72;color:#14100c}.reply>button{flex:none}
.reply input[type=file]:focus-visible + label{outline:3px solid #f2c14e;outline-offset:3px}
.reply button:disabled{opacity:.45;cursor:not-allowed}
.reply .f{display:flex;flex-direction:column;gap:6px;font-size:15px;color:#d5e3f2}
.reply .f input,.reply .f textarea{min-height:48px;padding:10px 12px;border-radius:10px;border:1px solid rgba(185,207,230,.35);background:#1f3352;color:#f6f1e8;font:17px 'Atkinson Hyperlegible',Verdana,sans-serif}
.reply video{width:100%;max-height:60vh;background:#000;border-radius:6px}
.reply .st{min-height:1.4em;font-weight:700;color:#f2c14e}
.reply .sent{display:flex;flex-direction:column;gap:10px}
.reply .tabs{display:flex;gap:6px;background:#1f3352;border-radius:999px;padding:5px}
.reply .tabs button{flex:1 1 0;min-height:46px;border:0;background:transparent;color:#d5e3f2}
.reply .tabs button[aria-pressed="true"]{background:#f6f1e8;color:#14100c}
.reply .mic{display:flex;flex-direction:column;align-items:center;gap:12px;padding:8px 0}
.reply .mic button.rec{width:112px;height:112px;flex:none;border-radius:50%;border:6px solid #f6f1e8;background:#e8433a;color:#fff;font-size:14px;padding:0}
.reply .mic button.rec.on{background:#14100c;border-color:#e8433a;animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 12px rgba(232,67,58,.25)}}
.reply .meter{width:100%;height:12px;border-radius:999px;background:#1f3352;overflow:hidden}.reply .meter i{display:block;height:100%;width:0;background:linear-gradient(90deg,#7be08f,#f2c14e,#ec9a72);transition:width .08s}
.reply .time{font:800 22px/1 Archivo,Arial,sans-serif;letter-spacing:.06em}
.reply audio{width:100%}
@media (prefers-reduced-motion:reduce){.reply .mic button.rec.on{animation:none}}
.reply .sent a{color:#14100c;background:#ec9a72;border-radius:999px;padding:14px 18px;text-align:center;font:800 15px/1 Archivo,Arial,sans-serif;text-decoration:none;text-transform:uppercase;letter-spacing:.06em}
</style>
</head>
<body>
<main>
  <a class="top" href="../" aria-label="Art Alive home"><img src="../art-alive-mark.png" alt=""><span class="k">Magic Postcard</span></a>
  <h1 id="t">Opening your postcard…</h1>
  <div class="wait" id="wait"><div class="spin" aria-hidden="true"></div><span>One moment…</span></div>
  <div id="view" hidden>
    <div class="card" id="card"><canvas id="cf" role="img" aria-label="The front of the postcard"></canvas><video id="vid" loop playsinline aria-label="The postcard's video"></video><canvas class="top" id="ctop" aria-hidden="true"></canvas></div>
    <div class="bar" style="margin-top:14px"><button type="button" class="pri" id="camBtn">Point at your postcard</button><button type="button" id="watchBtn">Watch it here</button></div>
    <div class="from" id="from" hidden><div class="strip" id="strip"></div><div class="fvid" id="fbox"><video id="mvid" playsinline loop preload="metadata"></video><button type="button" class="pp" id="pp" aria-label="Play the video message">&#9654;</button></div></div>
    <div class="msg" id="msg" style="margin-top:14px" hidden></div>
    <div class="from" id="from2" hidden><p class="k" style="margin:4px 0 0">On the back</p><div class="strip" id="strip2"></div><div class="fvid" id="fbox2"><video id="mvid2" playsinline loop preload="metadata"></video><button type="button" class="pp" id="pp2" aria-label="Play the video from the back">&#9654;</button></div></div>
  </div>
  <section class="reply" id="reply" hidden aria-labelledby="replyH">
    <h2 id="replyH">Send a reply</h2>
    <p id="replyP">Say thank you, wave hello, show them where you are. Up to a minute. Only they will see or hear it.</p>
    <div class="tabs" role="group" aria-label="Kind of reply"><button type="button" id="tVid" aria-pressed="true">Video reply</button><button type="button" id="tAud" aria-pressed="false">Voice reply</button></div>
    <div id="pVid">
      <div class="pick"><input type="file" id="rRec" accept="video/*" capture="user"><label class="b pri" for="rRec">Record a video</label><input type="file" id="rUp" accept="video/*"><label class="b" for="rUp">Upload a video</label></div>
      <video id="rPrev" controls playsinline hidden style="margin-top:12px"></video>
    </div>
    <div id="pAud" hidden>
      <div class="mic"><button type="button" class="rec" id="rMic">Record</button><span class="time" id="rTime" aria-live="off">0:00 / 1:00</span><div class="meter" aria-hidden="true"><i id="rLvl"></i></div></div>
      <audio id="rAud" controls hidden></audio>
      <div class="pick"><input type="file" id="rAudUp" accept="audio/*"><label class="b" for="rAudUp">Upload a voice memo</label></div>
    </div>
    <label class="f">Your name<input id="rName" maxlength="60" autocomplete="name"></label>
    <label class="f">A short note (optional)<textarea id="rNote" maxlength="300" rows="2"></textarea></label>
    <button type="button" class="pri" id="rSend" disabled>Send my reply</button>
    <p class="st" id="rSt" role="status" aria-live="polite"></p>
  </section>
  <p class="made" id="made" hidden>A Magic Postcard from <a href="../">Art Alive</a> · <a href="./">Send one yourself</a></p>
</main>
<script src="../site-config.js"></script><script src="../capture.js"></script><script src="../share.js"></script><script src="../stats.js"></script><script src="../account.js"></script><script src="../qr.js"></script><script src="postcard.js"></script><script src="animate.js"></script><script src="sound.js"></script>
<script>
(async function () {
  'use strict';
  const $ = id => document.getElementById(id), MP = window.MagicPostcard, C = window.ART_ALIVE || {};
  const qs = new URLSearchParams(location.search), code = (qs.get('c') || '').toLowerCase().replace(/[^a-z0-9]/g, '');
  const live = t => { let r = $('sr'); if (!r) { r = document.createElement('p'); r.id = 'sr'; r.setAttribute('aria-live', 'polite'); r.style.cssText = 'position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)'; document.body.appendChild(r); } r.textContent = ''; setTimeout(() => { r.textContent = t; }, 60); };
  function fail(h, t) { $('wait').hidden = true; $('t').textContent = h; const p = document.createElement('p'); p.textContent = t; $('wait').after(p); $('made').hidden = false; document.title = h + ' · Art Alive'; }
  const loadImg = src => new Promise((ok, no) => { const im = new Image(); im.onload = () => ok(im); im.onerror = no; im.src = src; });
  if (!window.AAAccount || !AAAccount.configured) return fail('Not ready yet', 'Magic Postcards are being set up. Please try again soon.');
  if (!code) return fail('Nothing to show here', 'This link is missing its code. Try scanning the QR code again.');

  // the postcard's files: pictures come down whole (small); videos stream from a private link that lasts a few hours,
  // so a long video starts quickly and never sits in the phone's memory all at once
  async function media(d) { const cl = await AAAccount.load(), jobs = [];
    for (const k of Object.keys(d)) { const v = d[k]; if (typeof v !== 'string' || !v.startsWith('aa-media:')) continue; const path = v.slice(9);
      const whole = () => cl.storage.from('media').download(path).then(({ data, error }) => { if (error) throw error; d[k] = URL.createObjectURL(data); });
      jobs.push(/\.(mp4|webm|mov|bin)$/i.test(path) || /^video2?$/.test(k)
        ? cl.storage.from('media').createSignedUrl(path, 21600).then(({ data, error }) => { if (error || !data) return whole(); d[k] = data.signedUrl; }).catch(whole)
        : whole()); }
    await Promise.all(jobs); }
  let row; try { row = await AAAccount.published(code); if (row) { await media(row.data); AAAccount.countView(code); if (window.AAStats) AAStats.log(code, 'open'); } } catch (e) { return fail('Couldn’t load it', 'Check your connection and try again.'); }
  if (!row || row.kind !== 'postcard') return fail('Not available', 'This postcard isn’t available right now.');
  const d = row.data;
  const url = AAAccount.PUB_URL ? AAAccount.PUB_URL(code) : new URL('../p/?c=' + code, location.href).href;
  let photo, icon; try { photo = await loadImg(d.photo); } catch (e) { return fail('Couldn’t load it', 'The picture didn’t load. Check your connection and try again.'); }
  icon = await loadImg(d.icon && d.icon !== 'aa' ? d.icon : '../art-alive-mark.png').catch(() => loadImg('../art-alive-mark.png')).catch(() => null);
  const card = { photo, icon, place: d.place, greet: d.greet, greetText: d.greetText, to: d.to, message: d.message, from: d.from, accent: d.accent, qr: url, address: { name: d.to || ' ' } };
  await MP.draw($('cf'), 'front', card, { scale: Math.min(3, (devicePixelRatio || 1) * 1.5) });
  const vsrc = p => p && /\.mp4$/.test(p) && !document.createElement('video').canPlayType('video/mp4; codecs="avc1.4D401E"') ? p.replace(/\.mp4$/, '.webm') : p;
  // how the picture moves: the place's own animation (a video), or Art Alive effects on their photo.
  // d.video is their video message, which plays under the card. (Early postcards kept a place's animation in d.video.)
  const isStock = p => typeof p === 'string' && /^stock\//.test(p);
  // a video saved with the postcard comes back as data: play it from a blob, which phones handle far better
  const asUrl = v => { if (typeof v !== 'string' || !v.startsWith('data:')) return v; try { const i = v.indexOf(','), mime = v.slice(5, i).split(';')[0], bin = atob(v.slice(i + 1)), u = new Uint8Array(bin.length);
    for (let k = 0; k < bin.length; k++) u[k] = bin.charCodeAt(k); return URL.createObjectURL(new Blob([u], { type: mime || 'video/mp4' })); } catch (e) { return v; } };
  const picSrc = vsrc(d.picVideo || (isStock(d.video) ? d.video : null)), msgSrc = d.video && !isStock(d.video) ? asUrl(vsrc(d.video)) : null,
    msg2Src = d.video2 ? asUrl(vsrc(d.video2)) : null;   // the back's own video message (if none, the front one plays there too)
  // the place's soundscape (waves, gulls, fireworks…), in step with the picture; quieter while a video message talks
  const soundUrl = d.sound || (/asbury-park/.test(picSrc || '') ? 'stock/sounds/asbury-park.mp3' : null);
  let clock = () => 0; const scape = soundUrl && window.MagicSound ? MagicSound.create(soundUrl, { getTime: () => clock() }) : null;
  const vidSrc = picSrc; if (vidSrc) $('vid').src = vidSrc; await MP.drawTop($('ctop'), card, { scale: 2 });
  const fromText = d.from ? 'From ' + d.from : 'A video message';
  const anim = !vidSrc && d.anim && window.MagicAnimate ? MagicAnimate.create(card.photo, d.anim) : null;
  if (anim) { anim.canvas.className = 'anim'; anim.canvas.setAttribute('aria-hidden', 'true'); $('card').insertBefore(anim.canvas, $('ctop')); }
  $('t').textContent = d.to ? 'A postcard for ' + d.to : 'A Magic Postcard'; document.title = $('t').textContent + ' · Art Alive';
  $('cf').setAttribute('aria-label', 'The front of the postcard' + (d.place ? ': ' + (d.greet !== false ? (d.greetText != null ? d.greetText : 'Greetings from') + ' ' : '') + d.place : ''));
  const mv = $('mvid'); let ar = 9 / 16;   // the video message's height for its width
  if (msgSrc) { $('strip').textContent = fromText; mv.src = msgSrc; mv.setAttribute('aria-label', 'Video message' + (d.from ? ' from ' + d.from : '')); $('from').hidden = false;
    mv.addEventListener('loadedmetadata', () => { if (mv.videoWidth) { ar = mv.videoHeight / mv.videoWidth; $('fbox').style.aspectRatio = mv.videoWidth + '/' + mv.videoHeight; } });
    ['play', 'pause'].forEach(ev => mv.addEventListener(ev, () => { const on = !mv.paused; $('fbox').classList.toggle('on', on); $('pp').innerHTML = on ? '&#10074;&#10074;' : '&#9654;'; $('pp').setAttribute('aria-label', (on ? 'Pause' : 'Play') + ' the video message'); })); }
  const msgPlay = on => { if (!msgSrc) return; if (on) { mv.muted = false; mv.play().catch(() => { mv.muted = true; mv.play().catch(() => {}); }); } else mv.pause(); };
  $('pp').onclick = mv.onclick = () => msgPlay(mv.paused);
  ['play', 'pause', 'volumechange'].forEach(ev => mv.addEventListener(ev, () => { if (scape) scape.duck(!mv.paused && !mv.muted); }));
  if (msg2Src) { const v2 = $('mvid2'); $('strip2').textContent = fromText; v2.src = msg2Src; v2.setAttribute('aria-label', 'Video from the back of the card' + (d.from ? ', from ' + d.from : '')); $('from2').hidden = false;
    v2.addEventListener('loadedmetadata', () => { if (v2.videoWidth) $('fbox2').style.aspectRatio = v2.videoWidth + '/' + v2.videoHeight; });
    ['play', 'pause'].forEach(ev => v2.addEventListener(ev, () => { const on = !v2.paused; $('fbox2').classList.toggle('on', on); $('pp2').innerHTML = on ? '&#10074;&#10074;' : '&#9654;'; if (on) mv.pause(); }));
    mv.addEventListener('play', () => v2.pause());
    $('pp2').onclick = v2.onclick = () => { if (v2.paused) { v2.muted = false; v2.play().catch(() => { v2.muted = true; v2.play().catch(() => {}); }); } else v2.pause(); }; }
  if (d.message || d.from) { const m = $('msg'); m.innerHTML = '<small>A message for you</small>'; m.appendChild(document.createTextNode((d.message || '') + (d.from ? '\n\n— ' + d.from : ''))); m.hidden = false; }
  $('wait').hidden = true; $('view').hidden = false; $('made').hidden = false;
  live('The postcard is ready. Press Point at your postcard, then point your phone at it. Or press Watch it here.');

  $('watchBtn').onclick = () => { const on = !$('card').classList.contains('on'); $('card').classList.toggle('on', on); $('watchBtn').textContent = on ? 'Stop' : 'Watch it here';
    msgPlay(on);
    if (scape) { clock = anim ? () => anim.time : () => $('vid').currentTime; if (on) scape.start(); else scape.stop(); }
    if (anim) { if (on) anim.start(); else anim.stop(); return; }
    const v = $('vid'); v.muted = true; if (on) v.play().catch(() => {}); else v.pause(); };

  /* the camera: find the postcard, work out which side is up, and play the video right on its picture */
  const sides = {}, sideCv = {};
  for (const side of ['front', 'back']) { const cv = side === 'front' ? $('cf') : await MP.draw(document.createElement('canvas'), 'back', card, { scale: 1 }); sideCv[side] = cv; sides[side] = AAAccount.FP.fromImage(cv, cv.width, cv.height); }
  // what the scanner matches, so it sits on the card itself and ignores the placemat, book or phone beside it:
  // the whole front, the front's square picture by itself (close up), and the back
  const sqCv = document.createElement('canvas'); { const f = $('cf'), k = MP.REGIONS.front[2]; sqCv.width = Math.round(f.width * k); sqCv.height = f.height; sqCv.getContext('2d').drawImage(f, 0, 0, sqCv.width, f.height, 0, 0, sqCv.width, f.height); }
  const apply = (H, u, v) => { const z = H[6] * u + H[7] * v + 1; return [(H[0] * u + H[1] * v + H[2]) / z, (H[3] * u + H[4] * v + H[5]) / z]; };
  $('camBtn').onclick = () => {
    if (window.AAStats) AAStats.log(code, 'camera');
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia || !window.AACapture) { live('This browser can’t use the camera here. Press Watch it here instead.'); return; }
    const ov = document.createElement('div'); ov.className = 'cam'; ov.setAttribute('role', 'dialog'); ov.setAttribute('aria-modal', 'true'); ov.setAttribute('aria-label', 'Camera');
    ov.innerHTML = '<div class="box"><video playsinline muted autoplay></video><div class="live"><video loop playsinline muted></video><canvas aria-hidden="true"></canvas></div><div class="under" hidden><div class="strip"></div><div class="uv"><video loop playsinline></video></div></div></div><p class="tip" aria-live="polite">Point your phone at the postcard. Keep all four corners in view.</p><div class="cbar"><button type="button" data-x="snd">Sound on</button><button type="button" data-x="back">Back</button></div>';
    document.body.appendChild(ov); document.body.style.overflow = 'hidden'; const mainEl = document.querySelector('main'); if (mainEl) mainEl.inert = true;
    const cam = ov.querySelector('.box>video'), box = ov.querySelector('.box'), lv = ov.querySelector('.live'), pv = lv.querySelector('video'), tip = ov.querySelector('.tip');
    if (vidSrc) { pv.src = vidSrc; pv.muted = true; }
    // the video message rides under the card: started now (this tap lets it play with sound), paused until the card is found
