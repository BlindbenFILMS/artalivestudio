<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Into the Light · an Art Alive game</title>
<meta name="theme-color" content="#15191f">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@112..125,600..900&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
html,body{margin:0;background:#15191f;color:#f2ede4;font:18px/1.5 'Atkinson Hyperlegible',Verdana,Arial,sans-serif}
main{max-width:760px;margin:0 auto;padding:20px 16px 40px}
.k{margin:0;font:800 13px/1 'Archivo',Arial,sans-serif;letter-spacing:.2em;text-transform:uppercase;color:#f5a623}
h1{margin:8px 0 2px;font:900 clamp(30px,7vw,52px)/1 'Archivo','Arial Black',Arial,sans-serif;font-stretch:118%;text-transform:uppercase;letter-spacing:-.01em}
.by{margin:0 0 18px;color:#a7adb6}
.made{margin-top:28px;text-align:center;font-size:15px;color:#a7adb6}.made a{color:#f2ede4}
/* Art Alive game player: the painting on top, then big clear controls underneath. */
.aag{--a-room:#15191f;--a-wall:#1d222a;--a-line:#2c333d;--a-cream:#f2ede4;--a-muted:#a7adb6;--a-orange:#ff7a2a;--a-blue:#2aa8e0;--a-gold:#f5a623;
  display:flex;flex-direction:column;gap:14px;color:var(--a-cream);font-family:'Atkinson Hyperlegible',Verdana,Arial,sans-serif;max-width:720px;margin:0 auto;width:100%}
.aag button{font:inherit;cursor:pointer}
.aag-stage{position:relative;border-radius:16px;overflow:hidden;background:#0b0d10;border:1px solid var(--a-line);aspect-ratio:var(--aag-ar,4/3);max-height:72vh;margin:0 auto;width:100%;
  max-width:calc(72vh * (var(--aag-ar-n,1)))}
.aag-cv{display:block;width:100%;height:100%;object-fit:contain;touch-action:none;user-select:none;-webkit-user-select:none}
.aag-cover,.aag-win{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:rgba(10,12,16,.45);text-align:center;padding:16px}
.aag-cover[hidden],.aag-win[hidden]{display:none}
.aag-play,.aag-again{min-height:64px;min-width:180px;padding:0 34px;border:0;border-radius:999px;background:var(--a-orange);color:#14100c;
  font:900 22px/1 'Archivo','Arial Black',Arial,sans-serif!important;letter-spacing:.06em;text-transform:uppercase;box-shadow:0 10px 30px -8px rgba(255,122,42,.8)}
.aag-play::before{content:'';display:inline-block;border-left:16px solid currentColor;border-top:10px solid transparent;border-bottom:10px solid transparent;margin-right:12px;vertical-align:-2px}
.aag-tip{margin:0;max-width:30ch;font-size:17px;font-weight:700;text-shadow:0 2px 8px #000}
.aag-win{background:rgba(10,12,16,.68)}
.aag-wint{margin:0;font:900 clamp(30px,7vw,52px)/1 'Archivo','Arial Black',Arial,sans-serif;text-transform:uppercase;background:linear-gradient(90deg,var(--a-orange),var(--a-gold));-webkit-background-clip:text;background-clip:text;color:transparent}
.aag-wins{margin:0;font-size:19px;color:var(--a-cream)}
.aag-status{margin:0;text-align:center;font:800 clamp(17px,2.6vw,21px)/1.3 'Archivo','Arial Black',Arial,sans-serif;letter-spacing:.02em;min-height:1.3em}

.aag-joy{width:150px;height:150px;border-radius:50%;background:radial-gradient(circle,#262c36 0 55%,#1d222a 56%);border:3px solid var(--a-line);position:relative;touch-action:none;

.aag-joy::before{content:'';position:absolute;inset:14px;border-radius:50%;border:2px dashed rgba(167,173,182,.35)}
.aag-knob{position:absolute;left:50%;top:50%;width:66px;height:66px;margin:-33px 0 0 -33px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffb27a,var(--a-orange) 55%,#c4501a);
  box-shadow:0 6px 16px -4px #000,inset 0 -4px 8px rgba(0,0,0,.25);pointer-events:none;transition:transform .06s}

.aag-dpad button{border:2px solid var(--a-line);border-radius:16px;background:var(--a-wall);color:var(--a-cream);font-size:24px;line-height:1;touch-action:none;user-select:none;-webkit-user-select:none}
.aag-dpad button.on,.aag-dpad button:active{background:var(--a-orange);color:#14100c;border-color:var(--a-orange)}
.aag-dpad .u{grid-area:1/2}.aag-dpad .l{grid-area:2/1}.aag-dpad .r{grid-area:2/3}.aag-dpad .d{grid-area:3/2}
.aag-tiltbox{text-align:center}.aag-tiltbox p{margin:0 0 10px;font-size:18px;font-weight:700}
.aag-small,.aag-bar button{min-height:48px;padding:0 20px;border-radius:999px;border:2px solid var(--a-line);background:transparent;color:var(--a-cream);font-weight:700;font-size:16px}
.aag-small:hover,.aag-bar button:hover{border-color:var(--a-cream)}
.aag-act{width:118px;height:118px;border-radius:50%;border:0;background:radial-gradient(circle at 35% 30%,#7fd3ff,var(--a-blue) 60%,#156f99);color:#0b1620;

.aag-act:active{transform:scale(.96)}
.aag-acts:empty{display:none}
.aag-bar{display:flex;flex-wrap:wrap;justify-content:center;gap:10px}
.aag-opts{display:flex;flex-wrap:wrap;justify-content:center;gap:10px 18px;font-size:15px;color:var(--a-muted)}
.aag-opts label{display:flex;align-items:center;gap:8px}
.aag-opts select{min-height:44px;border-radius:12px;border:2px solid var(--a-line);background:var(--a-wall);color:var(--a-cream);font:inherit;font-size:16px;padding:0 10px}
.aag-chk input{width:22px;height:22px;accent-color:var(--a-orange)}
.aag-sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.aag :focus-visible{outline:3px solid var(--a-blue);outline-offset:3px}

.aag-stage.aag-ar .aag-cv{position:absolute;left:0;top:0;width:auto;height:auto;transform-origin:0 0;opacity:0;pointer-events:none;object-fit:initial}

.aag-artip.hide{opacity:0}
.aag-bar .aag-arbtn{border-color:var(--a-blue);color:#bfe9ff}
