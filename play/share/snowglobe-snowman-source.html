// where the globe goes: the middle of its glass, and how big the glass is on the card (CLIP: where the photograph was cut from the page)
const CLIP = {"gl": {"x": 450, "y": 395.72569444444446, "r": 276.6319444444444, "w": 900, "h": 1010}, "clip": {"x": 85, "y": 97, "width": 730, "height": 802}}, GX = 298, GY = 235, GR = 219, k = GR / CLIP.gl.r, gi = document.getElementById('globe');
gi.style.left = (GX - (CLIP.gl.x - CLIP.clip.x) * k) + 'px'; gi.style.top = (GY - (CLIP.gl.y - CLIP.clip.y) * k) + 'px'; gi.style.width = (CLIP.clip.width * k) + 'px';
// the night sky behind everything, with still snow (the same sky and the same dots as the other cards)
let seed = 20261112;
function rnd() { seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }
const bg = document.getElementById('bg'), b = bg.getContext('2d'); b.setTransform(2, 0, 0, 2, 0, 0);
const dots = []; for (let i = 0; i < 110; i++) dots.push({ x: rnd() * 1200, y: rnd() * 630, r: 0.9 + rnd() * rnd() * 3.6, a: 0.35 + rnd() * 0.6, vy: 7 + rnd() * 15, ph: rnd() * 6.28 });
const KEEP_CLEAR = [[604, 84, 1140, 372], [596, 376, 1132, 476], [604, 478, 960, 540]];   // the words, the button and the last two lines: no snow on them
function drawBack() {
  const gr = b.createRadialGradient(700, 250, 40, 700, 250, 900);
  gr.addColorStop(0, '#22356b'); gr.addColorStop(0.42, '#182851'); gr.addColorStop(1, '#0a1330');
  b.fillStyle = gr; b.fillRect(0, 0, 1200, 630);
  const glow = b.createRadialGradient(GX, GY, GR * .5, GX, GY, GR * 1.9); glow.addColorStop(0, 'rgba(255,214,140,.13)'); glow.addColorStop(1, 'rgba(255,214,140,0)'); b.fillStyle = glow; b.fillRect(0, 0, 1200, 630);
  b.fillStyle = '#fff';
  for (const d of dots) { const x = d.x + Math.sin(d.ph) * 3; if (KEEP_CLEAR.some(q => x > q[0] - d.r && x < q[2] + d.r && d.y > q[1] - d.r && d.y < q[3] + d.r)) continue; b.globalAlpha = d.a; b.beginPath(); b.arc(x, d.y, d.r, 0, 7); b.fill(); }
  b.globalAlpha = 1;
}
window.__card = { ready: Promise.all([document.fonts.load('900 84px Archivo'), document.fonts.load('700 19px Archivo'), ...[...document.images].map(i => i.decode())]).then(() => document.fonts.ready).then(() => { drawBack(); return true; }) };
</script>
<script type="text/plain" id="how-to">
HOW THE PICTURE IS MADE FROM THIS PAGE
A robot browser (Playwright, with Node) opens this page 1200 x 630 at double sharpness and photographs the card; the photograph
is then halved to 1200 x 630 and saved as a JPG (quality 88), the same as the other cards in play/share/.

  // node shoot.js <address of this page> <folder for the result>
  const { chromium } = require('playwright'); const fs = require('fs');
  (async () => {
    const [url, out] = process.argv.slice(2); fs.mkdirSync(out, { recursive: true });
    const browser = await chromium.launch(), page = await (await browser.newContext({ viewport: { width: 1200, height: 630 }, deviceScaleFactor: 2 })).newPage();
    await page.goto(url); await page.evaluate(() => window.__card.ready);
    await page.locator('#card').screenshot({ path: out + '/card@2x.png' }); await browser.close();
  })();

  # python3: halve it and save it
  from PIL import Image
  Image.open('card@2x.png').convert('RGB').resize((1200, 630), Image.LANCZOS).save('snowglobe-snowman.jpg', 'JPEG', quality=88, optimize=True, subsampling=2)

After changing the picture, raise ?v=1 to ?v=2 in the preview tags at the top of snowglobe/snowman.html, so that apps fetch the new one.

HOW THE PHOTOGRAPH OF THE GLOBE WAS TAKEN (to take a new one, for example after the snowman or the globe changes)
The same robot browser opened the real page, snowglobe/snowman.html, 900 x 1010 at double sharpness, with:
  - the site's settings file answered with an empty one (window.ART_ALIVE = {}), so nothing touches the real database;
  - in the browser's memory, before the page loads:  aa-snowman-globe-1 = {"round":8,"word":"HAPPY HOLIDAYS"}  (the snowman at
    his full size, as after eight rounds)  and  aa-snowman-sound-1 = off  (so his mouth is still);
  - once "Tap to start" is ready, this style added, so that only the globe is left, on a see-through background:
      html,body{background:transparent!important}body>*:not(#stage){visibility:hidden!important}#stage canvas:first-child{visibility:hidden!important}
  - then the start button's own action run (document.getElementById('start').onclick()), and 0.6 seconds later the base told
    to show the one phrase:  window.__globe.g.set({ name: ['HAPPY HOLIDAYS'] })
  - then a photograph with a see-through background (omitBackground), 8.5 seconds after the start (the snow is still falling
    and his face is clear), of this part of the page, where g = window.__globe.g.glass (the middle of the glass and its radius):
      from x = g.x - 1.32 g.r, y = g.y - 1.08 g.r, 2.64 g.r wide and 2.9 g.r high.
The numbers in "const CLIP" in the script above are that photograph's: the glass (gl) and the part cut out (clip). The picture
inside this file is that photograph made 1156 px wide. For a new photograph, replace the picture (the long src of
<img id="globe">) and the numbers in CLIP.
</script>
