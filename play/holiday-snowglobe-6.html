<style>

<body>

<button type="button" class="sharetop vistop" id="eyes" hidden aria-pressed="false" aria-label="Turn on the blindness simulator"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg><span id="eyesT">Turn on blindness simulator</span></button>
<div class="vis" id="vis" hidden role="dialog" aria-labelledby="visH"><div class="in">
  <h2 id="visH">Blindness simulator</h2>
  <div class="conds" id="conds" role="group" aria-label="Eye conditions"></div>
  <label for="sev">How strong <input id="sev" type="range" min="10" max="100" value="50"><span id="sevP">50%</span></label>
  <p id="visDesc" aria-live="polite">Pick an eye condition to see the snow globe the way someone living with it might.</p>
  <div class="row"><button type="button" id="visOff">Turn off</button><button type="button" class="pri" id="visDone">Done</button></div>
</div></div>
<div class="lowrow"><a class="own" href="../snowglobe/"><b>Make your own</b><span>Your photo or video, free</span></a><a class="own" href="snowglobes.html"><b>More globes</b><span>See all eight</span></a></div>
<div class="go" id="go"><button type="button" id="start">Tap to start</button><p>Sound on. Then shake or tilt your phone, or swipe across the globe.</p></div>
<p class="sr" id="live" aria-live="polite"></p>
<script src="../snowglobe/sharelink.js"></script>
<script>
(function () {

  const logo = new Image(); let gold = null;

      g.drawImage(logo, 0, 0); g.globalCompositeOperation = 'source-in'; const gr = g.createLinearGradient(0, 0, gold.width * .3, gold.height);
      gr.addColorStop(0, '#fbe3a6'); gr.addColorStop(.45, '#e2b45a'); gr.addColorStop(.7, '#f6d68c'); gr.addColorStop(1, '#b5852f'); g.fillStyle = gr; g.fillRect(0, 0, gold.width, gold.height); };

  const $ = id => document.getElementById(id);
  $('msg').textContent = MSG; document.title = MSG + ' · Through Other Eyes · Snow Globe · Art Alive';

  const img = new Image(); img.src = Q.get('img') && /^[\w.\/-]+\.(jpe?g|png|webp)$/i.test(Q.get('img')) ? Q.get('img') : 'holiday-snowglobe.jpg';

  if (VID) { Object.assign(wave, { muted: true, loop: false, playsInline: true, preload: 'auto', src: VID }); wave.setAttribute('playsinline', ''); }

    try { wave.currentTime = 0; } catch (e) {} wave.muted = !soundOn; wave.volume = .8;

  // how much room the top needs: the greeting, then (on phones) the button under it, each with a small gap
  function topRoom() {
    const hd = document.querySelector('.top'), hb = hd ? hd.getBoundingClientRect().bottom : 100;
    document.documentElement.style.setProperty('--btnTop', Math.round(hb + 10) + 'px');

    return low + 10;
  }
  function size() {
    DPR = Math.min(2, devicePixelRatio || 1); W = innerWidth; H = innerHeight;
    for (const c of [sky, cv]) { c.width = Math.round(W * DPR); c.height = Math.round(H * DPR); }
    const top = topRoom(), bottom = 144, room = H - top - bottom;
    R = Math.max(60, Math.min(W * (W < 600 ? .42 : .42), room / 2.7)); cx = W / 2; cy = top + (room - R * 2.7) / 2 + R;
  }
  addEventListener('resize', size); size();

  /* a soft round flake, drawn once and reused */
  const flake = document.createElement('canvas'); flake.width = flake.height = 32;
  { const g = flake.getContext('2d'), r = g.createRadialGradient(16, 16, 0, 16, 16, 16); r.addColorStop(0, 'rgba(255,255,255,1)'); r.addColorStop(.45, 'rgba(255,255,255,.9)'); r.addColorStop(1, 'rgba(255,255,255,0)'); g.fillStyle = r; g.fillRect(0, 0, 32, 32); }

  /* ── the snow inside the globe (positions in globe units: the glass is radius 1) ── */
  const N = calm ? 450 : 1000, NB = 56, WALL = .955, BW = 2 / NB, REPOSE = BW * .38;

  const floorAt = u => Math.sqrt(Math.max(0, WALL * WALL - u * u));

  function land(f) {
    let b = binOf(f.u);

      if (Math.max(l, r) - y > REPOSE) b = nb; else break; }
    pile[b] = Math.min(.5, pile[b] + f.add); f.b = b; f.down = true;
    f.u = uOf(b) + (Math.random() - .5) * BW; f.v = surf(b) + f.add * (.2 + Math.random() * .8) - f.s * .2; f.vu = f.vv = 0;
  }
  // start with all the snow resting at the bottom, the way a globe sits on a shelf
  // start with the snow in the air, gently falling
  for (const f of F) { const a = Math.random() * 6.283, r = Math.sqrt(Math.random()) * .88; f.u = Math.cos(a) * r; f.v = Math.sin(a) * r; f.vv = .05; }
  function stir(amount, pu, pv) {
    E = Math.min(3, E + amount); pu = pu || 0; pv = pv || 0;
    // lift some of the pile: a little for a gentle shake, all of it for a big one
    const lift = Math.min(1, amount * 1.6 + (E > 1.4 ? .35 : 0));
    for (const f of F) {
      if (f.down) { if (Math.random() < lift) { f.down = false; pile[f.b] = Math.max(0, pile[f.b] - f.add); f.vu = (Math.random() - .5) * 1.8 * Math.min(2, E) + pu; f.vv = -(.15 + Math.random() * 1.4) * Math.min(2, E) + pv; } }
      else { f.vu += pu * (.5 + Math.random() * .5); f.vv += pv * (.5 + Math.random() * .5); }
    }
    if (E > .9) startWave();
    if (E > .9 && !shookOnce) { shookOnce = true;   // the simulator appears only after they've seen the globe with their own eyes
      setTimeout(() => { const b = $('eyes'); b.hidden = false; b.classList.add('show'); say('New: turn on the blindness simulator, at the top, to see the globe the way someone with sight loss might.'); }, 2500); }
    if (E > .9 && (!wasStormy || $('hint').classList.contains('big') || $('hint').dataset.s !== '1')) { wasStormy = true; stormT = 0; $('hint').classList.remove('big'); $('hint').dataset.s = '1'; $('hint').textContent = 'Let it settle…'; try { navigator.vibrate && navigator.vibrate(25); } catch (e) {} }

  }

  function step(dt, t) {
    E *= Math.exp(-dt * (calm ? 1.3 : .75)); if (wasStormy) stormT += dt;
    gx += (tgx - gx) * Math.min(1, dt * 4); gy += (tgy - gy) * Math.min(1, dt * 4);

    side = Math.max(-.85, Math.min(.85, Math.sin(side * Math.PI / 180) * 1.3)); tgx = side; tgy = Math.sqrt(1 - side * side);
  }
  let drag = null;
  cv.addEventListener('pointerdown', e => { drag = { x: e.clientX, y: e.clientY, t: performance.now() }; ac(); });
  addEventListener('pointerup', () => { drag = null; });
  cv.addEventListener('pointermove', e => {
    if (!drag) return; const now = performance.now(), dt = Math.max(8, now - drag.t) / 1000, du = (e.clientX - drag.x) / R / dt, dv = (e.clientY - drag.y) / R / dt;
    const pu = (e.clientX - cx) / R, pv = (e.clientY - cy) / R;
    if (pu * pu + pv * pv < 1.3) { for (const f of F) { const d = Math.hypot(f.u - pu, f.v - pv); if (d < .45) { const k = (1 - d / .45) * .5; if (f.down) { f.down = false; pile[f.b] = Math.max(0, pile[f.b] - f.add); } f.vu += du * k; f.vv += dv * k; } }
      stir(Math.min(.3, Math.hypot(du, dv) * .015), du * .08, dv * .08); }
    drag = { x: e.clientX, y: e.clientY, t: now };
  });
  $('shake').onclick = () => { ac(); stir(2.6, (Math.random() - .5) * .6, -.4); };
  addEventListener('keydown', e => { if ((e.key === 's' || e.key === 'S') && !e.metaKey && !e.ctrlKey) { ac(); stir(2.6, 0, -.4); } });
  $('share').onclick = () => AAShareLink.open({ url: location.href.split('#')[0], title: MSG + ' · Snow Globe', text: MSG + ((FROM || (LOGO_SRC ? 'Ora' : '')) ? ' from ' + (FROM || 'Ora') : '') + '! Shake your phone to make it snow, then turn on the blindness simulator to see it the way someone with sight loss might.' });
  /* the "Other eyes" panel */
  const conds = $('conds');
  CONDS.forEach(c => { const b = document.createElement('button'); b.type = 'button'; b.textContent = c.chip; b.setAttribute('aria-pressed', 'false'); b.setAttribute('aria-label', c.chip + ': ' + c.label);
    b.onclick = () => pickCond(c.id); conds.appendChild(b); });
  { const b = document.createElement('button'); b.type = 'button'; b.className = 'shk'; b.innerHTML = '❄ Shake globe'; b.setAttribute('aria-label', 'Shake the globe');
    b.onclick = () => $('shake').click(); conds.appendChild(b); }
  const START = { rp: 50, glaucoma: 63, floaters: 88, cataracts: 75, amd: 63 }; let sevTouched = false;
  function pickCond(id) {
    if (id && !sevTouched) { $('sev').value = START[id]; VS.sev = START[id] / 100; $('sevP').textContent = START[id] + '%'; }
    VS.cond = id; if (id) VS.last = id; const c = CONDS.find(k => k.id === id);
    conds.querySelectorAll('button:not(.shk)').forEach((b, i) => b.setAttribute('aria-pressed', CONDS[i].id === id ? 'true' : 'false'));
    $('visDesc').textContent = c ? c.desc : 'Pick an eye condition to see the snow globe the way someone living with it might.';
    $('eyes').setAttribute('aria-pressed', id ? 'true' : 'false'); $('eyesT').textContent = c ? 'Simulator: ' + c.chip : 'Turn on blindness simulator';
    $('eyes').setAttribute('aria-label', c ? 'Blindness simulator on: ' + c.label + '. Change or turn off' : 'Turn on the blindness simulator');
    if (c && glFailed) $('visDesc').textContent = 'This browser can’t show the eye conditions. Try Chrome or Safari on your phone.';
  }
  $('eyes').onclick = () => { const v = $('vis'); v.hidden = !v.hidden; if (!v.hidden) { if (!VS.cond) pickCond('amd'); (conds.querySelector('[aria-pressed=true]') || conds.firstChild).focus(); } };
  $('sev').oninput = () => { sevTouched = true; VS.sev = $('sev').value / 100; $('sevP').textContent = $('sev').value + '%'; };
  $('visOff').onclick = () => { pickCond(''); $('vis').hidden = true; $('eyes').focus(); say('Back to your own eyes.'); };
  $('visDone').onclick = () => { $('vis').hidden = true; $('eyes').focus(); };
  addEventListener('keydown', e => { if (e.key === 'Escape' && !$('vis').hidden) { $('vis').hidden = true; $('eyes').focus(); } });

  $('snd').onclick = () => { soundOn = !soundOn; $('snd').textContent = soundOn ? 'Sound on' : 'Sound off'; $('snd').setAttribute('aria-pressed', soundOn); if (waveOn) wave.muted = !soundOn; };
  $('start').onclick = async () => {
    ac();
    try { if (window.DeviceMotionEvent && DeviceMotionEvent.requestPermission) await DeviceMotionEvent.requestPermission(); } catch (e) {}
    try { if (window.DeviceOrientationEvent && DeviceOrientationEvent.requestPermission) await DeviceOrientationEvent.requestPermission(); } catch (e) {}
    addEventListener('devicemotion', onMotion); addEventListener('deviceorientation', onTilt);
    $('go').remove(); $('shake').focus({ preventScroll: true });
    // let the video play with sound later (this tap is what allows it on phones), then wait for the first shake
    if (VID) { wave.muted = false; wave.play().then(() => { if (!waveOn) { wave.pause(); wave.currentTime = 0; } }, () => {}); }
    say(SAY_MSG + '. A snow globe with a photo of three friends in a snowy park. Shake your phone, tilt it, or press Shake to make it snow.');
  };

  /* ── run ── */
  let last = performance.now();
  (function frame(now) {
    const dt = Math.max(0, Math.min(.05, (now - last) / 1000)), t = now / 1000; last = now;
    step(dt, t); drawSky(t, dt); draw(t); sound(dt);
    requestAnimationFrame(frame);
  })(last);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { size(); draw(performance.now() / 1000); });
})();
</script>
